# ==========================================================
# Nginx reverse proxy untuk WhatsApp Gateway Enterprise
# Simpan di: /etc/nginx/sites-available/whatsapp-gateway
# Aktifkan : ln -s /etc/nginx/sites-available/whatsapp-gateway /etc/nginx/sites-enabled/
# ==========================================================

# F4: upstream multi-API (stateless). Tambah baris `server` per API node.
# Socket.IO memakai Redis adapter → sticky session TIDAK diperlukan; pakai least_conn.
# (Jika tetap ingin sticky, ganti `least_conn;` dengan `ip_hash;`.)
upstream wa_api {
    least_conn;
    server 127.0.0.1:4000 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=15s;
    # server 10.0.0.11:4000;   # contoh: API node di server lain
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.com;

    # Untuk verifikasi Certbot (sebelum SSL aktif)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.example.com;

    # --- SSL (diisi oleh Certbot, lihat docs/DEPLOYMENT.md) ---
    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 60M;   # sesuaikan dengan MAX_UPLOAD_MB

    # --- Frontend (React build statis) ---
    root /var/www/whatsapp-gateway/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API backend ---
    location /api/ {
        proxy_pass http://wa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://wa_api;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://wa_api;
    }

    # --- Socket.IO (WebSocket) ---
    location /socket.io/ {
        proxy_pass http://wa_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
